services:
  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:0.40.5@sha256:5d3a2f25f9825628daba94dc0b1d421c7d57d6c03ae5faa9ba050e058bab8241
    gpus: all
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama
      - runner
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    depends_on:
      ollama:
        condition: service_healthy
    tty: true
    stdin_open: true
    profiles:
      - ollama

  tradingagents-runner:
    build: .
    entrypoint: ["tradingagents-runner"]
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - TRADINGAGENTS_RUNNER_TOKEN_FILE=/run/secrets/runner_api_token
      - OPENBB_RESEARCH_URL=https://thinkpad-prod.tailaf054d.ts.net/api/research
      - OPENBB_RESEARCH_TOKEN_FILE=/run/secrets/runner_api_token
    secrets:
      - runner_api_token
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_data}:/home/appuser/.tradingagents
    ports:
      - "${TRADINGAGENTS_RUNNER_BIND_IP:-127.0.0.1}:8000:8000"
    extra_hosts:
      - "thinkpad-prod.tailaf054d.ts.net:${THINKPAD_PROD_IP:?THINKPAD_PROD_IP is required for the runner}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - runner

volumes:
  tradingagents_data:
  ollama_data:

secrets:
  runner_api_token:
    file: ${TRADINGAGENTS_RUNNER_TOKEN_FILE:-./runner_api_token.txt}
